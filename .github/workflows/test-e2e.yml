name: E2E Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build binary
        run: make build

      # Pinned to a release so the kind it installs changes only through a Dependabot PR.
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          wait: 60s

      - name: Run e2e demo
        run: make demo

      - name: Clean up demo
        run: make demo-clean

      # Guards the multi-namespace watch path, which the demo does not exercise.
      - name: Verify watch mode across namespaces
        run: make test-e2e-watch
